<!DOCTYPE html>
<html>
    <head>
        <title>Rhythm Accuracy Checker</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
    <body>
        <div class="container mt-5">
            <h1 class="mb-3">Rhythm Accuracy Checker</h1>
            <p class="text-muted">Upload an audio file to check its rhythm accuracy.</p>

            <form action="/analyze" method="post" enctype="multipart/form-data">
                <!--1.音源ファイル選択-->
                <div class="mb-3">
                    <label for="audio_file" class="form-label">Audio File:</label>
                    <input type="file" class="form-control" id="audio_file" name="audio_file" accept="audio/*" required>
                </div>
                
                <!--2.BPM入力-->
                <div class="mb-3">
                    <label for="bpm" class="form-label">BPM (Beats Per Minute):</label>
                    <input type="number" class="form-control" id="bpm" name="bpm" min="1" step="1" required>
                </div>

                <!--3.拍子（Time Signature）の入力欄-->
                <div class="mb-3">
                    <label class="form-label">Time Signature(拍子):</label>
                    <div class="d-flex align-items-center gap-2">
                    <!-- 分子：1小節の中に何拍あるか（例：4/4なら「4」）-->
                    <input type="number" class="form-control" id="time_num" name="time_num" value="4" required min="1" style="width: 50px;">
                    <span>/</span>
                    <!--分母：何分音符を一拍とするか（例：4/4なら「4」）-->
                    <select class="form-select" style="width: 100px;" id="time_den" name="time_den" required>
                        <option value="4" selected>4</option>
                        <option value="8">8</option>
                        <option value="16">16</option>
                        <option value="32">32</option>
                    </select>
                </div>
            </div>

            <div class="mb-3">
                <label for="note_value" class="form-label">Note Value(分析する音符の細かさ):</label>
                <select class="form-select" id="note_value" name="note_value" required>
                    <option value="4">4分音符</option>
                    <option value="8">8分音符</option>
                    <option value="16">16分音符</option>
                    <option value="32">32分音符</option>
                </select>
            </div>
            
            
            <button type="submit" class="btn btn-primary">Upload</button>
        </form>
    </body>
</html>
