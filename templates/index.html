<!DOCTYPE html>
<html>
    <head>
        <title>Rhythm Accuracy Checker</title>
    </head>
    <body>
        <h1>Rhythm Accuracy Checker</h1>
        <p>Upload an audio file to check its rhythm accuracy.</p>

        <form action="/analyze" method="post" enctype="multipart/form-data">
            <!--1.音源ファイル選択-->
            <div>
                <label for="audio_file">Audio File:</label>
                <input type="file" id="audio_file" name="audio_file" accept="audio/*" required>
            </div>
            <br>
            
            <!--2.BPM入力-->
            <div>
                <label for="bpm">BPM (Beats Per Minute):</label>
                <input type="number" id="bpm" name="bpm" min="1" step="1" required>
            </div>
            <br>

            <!--3.拍子（Time Signature）の入力欄-->
            <div>
                <label>Time Signature(拍子):</label>
                <!-- 分子：1小節の中に何拍あるか（例：4/4なら「4」）-->
                <input type="number" id="time_num" name="time_num" value="4" required min="1" style="width: 50px;">
                <span>/</span>
                <!--分母：何分音符を一拍とするか（例：4/4なら「4」）-->
                <select id="time_den" name="time_den" required>
                    <option value="4" selected>4</option>
                    <option value="8">8</option>
                    <option value="16">16</option>
                    <option value="32">32</option>
                </select>
            </div>
            <br>

            <div>
                <label for="note_value">Note Value(分析する音符の細かさ):</label>
                <select id="note_value" name="note_value" required>
                    <option value="4">4分音符</option>
                    <option value="8">8分音符</option>
                    <option value="16">16分音符</option>
                    <option value="32">32分音符</option>
                </select>
            </div>
        <br>
        

            <button type="submit">Upload</button>
        </form>
    </body>
</html>
